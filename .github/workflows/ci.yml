name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Bandit
        run: python -m bandit -r app

      - name: Audit dependencies
        run: python -m pip_audit

  test:
    runs-on: ubuntu-latest
    needs: analyse
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov
      - name: Start Flask application and run tests
        run: |
          python app.py > /tmp/broadbandcheck-flask.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/login > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/broadbandcheck-flask.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:5000/login > /dev/null; then
            cat /tmp/broadbandcheck-flask.log
            exit 1
          fi

          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

  package:
    runs-on: ubuntu-latest
    needs:
      - analyse
      - test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Create package
        run: |
          mkdir -p dist
          zip -r "dist/broadbandcheck-${{ github.sha }}.zip" . \
            -x ".git/*" ".venv/*" "__pycache__/*" ".pytest_cache/*" "dist/*"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: broadbandcheck-${{ github.sha }}
          path: dist/*.zip
