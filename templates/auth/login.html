{% extends "base.html" %}
{% block title %}Sign in · {{ config.APP_NAME }}{% endblock %}
{% block content %}
  <header class="page-header">
    <p class="eyebrow">{{ config.APP_NAME }} · secure notes</p>
    <h1>Sign in</h1>
    <p class="intro">Access your private notebook.</p>
  </header>
  {% include "auth/messages.html" %}
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="32" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">Need an account? <a href="{{ url_for('auth.signup') }}">Create one</a>.</p>
{% endblock %}
